services:
  backend:
    build: ./backend
    container_name: worklog-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Required for credential encryption
      - WORKLOG_ENC_KEY=${WORKLOG_ENC_KEY}
      - DATABASE_URL=sqlite:////app/data/worklog.db
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-60}
      # Allow frontend origin(s)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - worklog-data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: worklog-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  worklog-data:
